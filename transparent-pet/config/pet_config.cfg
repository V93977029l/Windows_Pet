[pet]

# 精灵缩放倍率 (0.2 ~ 4.0)，1.0 = 原始大小
scale=1.0
# 当前使用的材质预设 ID（slime_1=普通, slime_2=液态玻璃）
material_preset="slime_1"

[window]

# 窗口初始 X 坐标，-1 表示使用屏幕居中
initial_x=-1
# 窗口初始 Y 坐标，-1 表示使用屏幕居中
initial_y=-1
# 窗口是否始终置顶
always_on_top=true

[autostart]

# 是否开机自启动
enabled=false

[throw]

# 抛射效果开关
enabled=true
# 重力加速度（像素/秒²）
gravity=800.0
# 最小抛射触发速度（像素/秒），低于此值不触发抛射
min_speed=350.0
# 最大抛射速度上限（像素/秒），超出截断
max_speed=800.0
# 抛射速度放大系数
multiplier=2.0

[physics]

# 速度采样缓冲大小（帧数）
velocity_buffer_size=8
# 地面反弹阻尼系数（0=完全不弹, 1=完全弹性）
ground_bounce=0.3
# 墙壁反弹阻尼系数
wall_bounce=0.7
# 地面摩擦力（像素/秒²），在地面滑动时持续减速
ground_friction=500.0
# 安全网坠落阈值（像素），超出此高度强制停止抛射
fall_threshold=500.0

[liquid_glass]

# 背景形状类型（3=史莱姆形状）
bg_type=3
# 是否启用边缘模糊
blur_edge=true
# 模糊半径（像素）
blur_radius=2.0
# 玻璃着色颜色（RGBA，每个通道 0.0~1.0）
tint_r=0.3
tint_g=0.6
tint_b=0.9
# 着色透明度（0.0~1.0）
tint_alpha=0.35
# 玻璃项的宽度（物理像素）
item_width=200.0
# 玻璃项的高度（物理像素）
item_height=132.0
# 玻璃项的圆角半径（物理像素）
item_radius=65.0

[svg]

# SVG 画布 200×132，中心 (100, 66)
# 史莱姆轮廓相对于画布中心的偏移（非对称，因图形在画布中不居中）
# 碰撞半宽占纹理宽度的比例（左右对称：80/200=0.4）
half_w_ratio=0.4
# 碰撞顶部偏移占纹理高度的比例（(66-19.8)/132=0.35，从中心向上量）
top_offset_ratio=0.35
# 碰撞底部偏移占纹理高度的比例（(121-66)/132=0.417，从中心向下量）
bottom_offset_ratio=0.417
# 回退纹理宽度（像素）
fallback_size_x=200
# 回退纹理高度（像素）
fallback_size_y=132
